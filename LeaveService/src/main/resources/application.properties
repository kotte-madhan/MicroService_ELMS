spring.application.name=leave-service

server.port=8083

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/leave_db
spring.datasource.username=postgres
spring.datasource.password=root

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.LeaveService=DEBUG

# Cache
spring.cache.type=simple

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Employee Service URL
employee.service.url=http://localhost:8081

# Department Service URL
department.service.url=http://localhost:8082

# Notification Service URL
notification.service.url=http://localhost:8084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# JWT Configuration (Story 10)
jwt.secret=ElmsSecretKeyForJWTValidationAcrossAllMicroservices2026
jwt.expiration=3600000

# RabbitMQ Configuration (Story 11)
spring.rabbitmq.enabled=true
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# RabbitMQ Event Configuration
rabbitmq.exchange.name=elms.events
rabbitmq.queue.leave.applied=leave.applied
rabbitmq.queue.leave.approved=leave.approved
rabbitmq.queue.leave.rejected=leave.rejected
rabbitmq.routing.key.leave.applied=leave.*.applied
rabbitmq.routing.key.leave.approved=leave.*.approved
rabbitmq.routing.key.leave.rejected=leave.*.rejected

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

spring.jpa.open-in-view=false

server.error.include-stacktrace=never
server.error.include-message=always

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

resilience4j.circuitbreaker.instances.employeeService.sliding-window-size=5
resilience4j.circuitbreaker.instances.employeeService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.employeeService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.employeeService.permitted-number-of-calls-in-half-open-state=2

management.tracing.sampling.probability=1.0
resilience4j.retry.instances.employeeService.max-attempts=3
resilience4j.retry.instances.employeeService.wait-duration=2s

resilience4j.retry.instances.notificationService.max-attempts=3
resilience4j.retry.instances.notificationService.wait-duration=2s

resilience4j.timelimiter.instances.employeeService.timeout-duration=5s
resilience4j.timelimiter.instances.notificationService.timeout-duration=5s
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

