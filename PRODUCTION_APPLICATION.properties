# Production Configuration Template
# Apply this to all services: EmployeeService, LeaveService, NotificationService, etc.

# ===================================================
# STORY 1: Outbox Pattern
# ===================================================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

outbox.publisher.enabled=true
outbox.publisher.retry-interval=5000
outbox.publisher.max-retries=3
outbox.publisher.batch-size=50
outbox.publisher.cleanup-enabled=true
outbox.publisher.cleanup-schedule=0 0 2 * * *
outbox.publisher.cleanup-older-than-hours=24

# ===================================================
# STORY 2 & 3: RabbitMQ DLQ & Duplicate Handling
# ===================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Message retry configuration
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

# DLQ configuration (handled in code)
rabbitmq.dlq.enabled=true
rabbitmq.dlq.handler.enabled=true

# ===================================================
# STORY 4: Advanced Saga
# ===================================================
saga.orchestration.enabled=true
saga.orchestration.timeout-seconds=600
saga.orchestration.retry-attempts=3
saga.orchestration.retry-delay-ms=1000
saga.orchestration.recovery-interval-seconds=60

# ===================================================
# STORY 5: Distributed Locking
# ===================================================
app.lock.enabled=true
app.lock.timeout-seconds=30
app.lock.retry-delay-ms=100
app.lock.max-retries=50
app.lock.redis-key-prefix=lock:

# ===================================================
# STORY 6 & 7: Redis Caching
# ===================================================
spring.cache.type=redis
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
spring.redis.timeout=2000

# Cache configuration
spring.cache.redis.time-to-live=3600000
spring.cache.redis.key-prefix=cache:
spring.cache.redis.use-key-prefix=true

# Cache layer for specific resources
cache.employee.ttl-minutes=60
cache.department.ttl-minutes=120
cache.leave-type.ttl-minutes=1440
cache.config.ttl-minutes=180

# ===================================================
# STORY 8: Observability & Metrics
# ===================================================
management.endpoints.web.exposure.include=health,metrics,prometheus,info,env
management.endpoint.health.show-details=when-authorized
management.endpoint.metrics.enabled=true

management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.logback=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=production

# Prometheus export
management.metrics.export.prometheus.enabled=true
management.endpoints.web.metrics-path=/metrics

# Custom metric recording interval
management.metrics.export.prometheus.step=60s

# ===================================================
# STORY 9: Distributed Request Tracking
# ===================================================
app.tracing.enabled=true
app.tracing.include-request-body=false
app.tracing.include-response-body=false
app.tracing.trace-header-name=X-Trace-ID
app.tracing.correlation-header-name=X-Correlation-ID
app.tracing.span-header-name=X-Span-ID

logging.level.com.elms.common.tracing=DEBUG

# ===================================================
# STORY 11: Database Indexing
# ===================================================
app.database.index-check.enabled=true

# ===================================================
# STORY 12: Graceful Shutdown
# ===================================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s

app.shutdown.graceful.enabled=true
app.shutdown.graceful.timeout-ms=30000

# ===================================================
# Connection Pool
# ===================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===================================================
# JPA & Hibernate
# ===================================================
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=true

# Query timeout (seconds)
spring.jpa.properties.javax.persistence.query.timeout=30000

# ===================================================
# Logging
# ===================================================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n
logging.file.name=logs/${spring.application.name}.log
logging.file.max-size=10MB
logging.file.max-history=30

# Log levels
logging.level.root=INFO
logging.level.com.elms=DEBUG
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=DEBUG

# ===================================================
# Task Scheduling
# ===================================================
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=elms-scheduler-

spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=elms-executor-

# ===================================================
# Jackson Configuration
# ===================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

