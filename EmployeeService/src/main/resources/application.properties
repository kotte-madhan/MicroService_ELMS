spring.application.name=employee-service

server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/employee_db
spring.datasource.username=postgres
spring.datasource.password=root

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.EmployeeService=DEBUG

# Cache
spring.cache.type=simple

# Actuator (Story 15)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# JWT (Story 10)
jwt.secret=ElmsSecretKeyForJWTValidationAcrossAllMicroservices2026
jwt.expiration=3600000

# RabbitMQ Configuration (Story 11)
spring.rabbitmq.enabled=true
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

rabbitmq.exchange.name=elms.events

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

spring.jpa.open-in-view=false

server.error.include-stacktrace=never
server.error.include-message=always

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

resilience4j.timelimiter.instances.employeeService.timeout-duration=5s
resilience4j.timelimiter.instances.notificationService.timeout-duration=5s
management.tracing.sampling.probability=1.0

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

resilience4j.retry.instances.departmentService.max-attempts=3
resilience4j.retry.instances.departmentService.wait-duration=2s

resilience4j.timelimiter.instances.departmentService.timeout-duration=5s

