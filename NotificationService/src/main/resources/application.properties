spring.application.name=notification-service

server.port=8084

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_db
spring.datasource.username=postgres
spring.datasource.password=root

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.NotificationService=DEBUG

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Async
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10

# Actuator (Story 15)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# JWT Configuration (Story 10)
jwt.secret=ElmsSecretKeyForJWTValidationAcrossAllMicroservices2026
jwt.expiration=3600000

# RabbitMQ Configuration (Story 11)
spring.rabbitmq.enabled=true
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# RabbitMQ Event Configuration
rabbitmq.exchange.name=elms.events
rabbitmq.queue.leave.applied=leave.applied
rabbitmq.queue.leave.approved=leave.approved
rabbitmq.queue.leave.rejected=leave.rejected
rabbitmq.routing.key.leave.applied=leave.*.applied
rabbitmq.routing.key.leave.approved=leave.*.approved
rabbitmq.routing.key.leave.rejected=leave.*.rejected

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

spring.jpa.open-in-view=false

server.error.include-stacktrace=never
server.error.include-message=always

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

resilience4j.circuitbreaker.instances.notificationService.sliding-window-size=5
resilience4j.circuitbreaker.instances.notificationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationService.wait-duration-in-open-state=10s

resilience4j.retry.instances.notificationService.max-attempts=3
resilience4j.retry.instances.notificationService.wait-duration=1s

management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

